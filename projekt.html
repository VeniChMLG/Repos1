<html lang="en">

<body class="bg-dark">
    <div id="app" class="w-25 mx-auto bg-light vh-100 p-3">
<input type="text" id="app">
<label for="app"></label>
<button id="app">Button</button>
<div id="app"></div>
    </div>
    <script>
        function buildList(){
            todosContainer.InnerHTML = "";
            arrayOfTodos.array.forEach(element => {
                let container = document.createElement("div");
                container.classList.add("card-body","card","shadow");
                let id = document.createElement("p");
                id.classList.add("small");
                let title = document.createElement("h3");
                title.classList.add("h3");
                let button = document.createElement("button");
                button.classList.add("btton bg-danger rounded text-white");

                id.textContent = "ID: " + element.id;
                title.textContent = "Title: " + element.title;
                
            });
        }
    </script>
</body>
</html>
